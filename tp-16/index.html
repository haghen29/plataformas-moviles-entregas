<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valpoletano</title>
  <!-- bootstrap desde el cdn -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- mis estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- barra de arriba con el nombre de la pagina -->
  <nav class="navbar bg-dark">
    <div class="container">
      <span class="navbar-brand text-white">Valpoletano</span>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Recetario</h1>

    <!-- botones para cambiar el tipo de comida -->
    <!-- a la funcion le paso el nombre que usa la api (las americanas son "United States") -->
    <div class="mb-3">
      <button class="btn btn-danger" onclick="cargarRecetas('Chinese')">Chinas</button>
      <button class="btn btn-success" onclick="cargarRecetas('Italian')">Italianas</button>
      <button class="btn btn-primary" onclick="cargarRecetas('United States')">Americanas</button>
    </div>

    <!-- este titulo lo cambio desde el js -->
    <h3 id="titulo">Recetas chinas</h3>

    <!-- spinner de carga, se muestra mientras espero a la api -->
    <div id="spinner" class="text-center my-4">
      <div class="spinner-border" role="status"></div>
      <p>Cargando...</p>
    </div>

    <!-- aca adentro el js mete las cartas de las recetas -->
    <div class="row" id="recetas"></div>
  </div>

  <!-- modal para ver la receta -->
  <!-- esta escondido y se abre cuando tocas "Ver receta" -->
  <div class="modal fade" id="modalReceta" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <!-- el nombre de la receta -->
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <!-- aca va la foto, los ingredientes y los pasos -->
        <div class="modal-body" id="modalCuerpo"></div>
      </div>
    </div>
  </div>

  <!-- js de bootstrap (lo necesito para el modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- mi js -->
  <script src="script.js"></script>
</body>
</html>
