<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valpoletano</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar bg-dark">
    <div class="container">
      <span class="navbar-brand text-white">Valpoletano</span>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Recetario</h1>

    <div class="mb-3">
      <button class="btn btn-danger" onclick="cargarRecetas('Chinese')">Chinas</button>
      <button class="btn btn-success" onclick="cargarRecetas('Italian')">Italianas</button>
      <button class="btn btn-primary" onclick="cargarRecetas('American')">Americanas</button>
    </div>

    <h3 id="titulo">Recetas chinas</h3>

    <div id="spinner" class="text-center my-4">
      <div class="spinner-border" role="status"></div>
      <p>Cargando...</p>
    </div>

    <div class="row" id="recetas"></div>
  </div>

  <!-- modal para ver la receta -->
  <div class="modal fade" id="modalReceta" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalCuerpo"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
